name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode verify
      - name: Smoke test executable JAR
        run: |
          JAR_FILE=$(ls target/xhlcli-*.jar | grep -v original | head -n 1)
          java -jar "$JAR_FILE" --help
          java -jar "$JAR_FILE" --version
